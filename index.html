.task-check-mini-bar span,.task-check-bar span{height:100%;background:#7789db;display:block;border-radius:99px;transition:width .2s}
.task-check-mini-bar.all-done span,.task-check-bar.all-done span{background:#52b99b}

.task-table .task-check-list-cell .task-check-mini-bar{margin-top:5px}
.task-drawer .task-check-section{background:#fff}
.task-check-heading{display:flex;align-items:center;gap:10px;justify-content:space-between}

.task-check-bar{height:7px;margin-top:10px}

.task-check-toggle svg{width:12px;height:12px}
.task-check-text{flex:1;min-width:0;color:#465064;line-height:1.5;text-align:left;background:transparent;border:0;font-size:11px;padding:4px 0;overflow-wrap:anywhere}

// Progress is stored independently from calendar and checklist information.
// Existing records without progress are mapped to 0% or 100% (completed).
const progressValue=item=>item?.done||item?.status==='완료'?100:(Number.isFinite(Number(item?.progress))?Math.max(0,Math.min(100,Math.round(Number(item.progress)/10)*10)):(item?.status==='진행중'?10:0));
const averageProgress=arr=>arr.length?Math.round(arr.reduce((sum,item)=>sum+progressValue(item),0)/arr.length):0;

function progressPicker(item,type){const isSchedule=type==='schedule';const field=isSchedule?'schedule-progress':'work-progress';return `<label class="progress-picker" title="진행률을 10% 단위로 선택"><span class="progress-meter" aria-hidden="true"><i style="width:${progressValue(item)}%"></i></span><select data-${field}="${esc(item.id)}" aria-label="${esc(item.title)} 진행률">${progressOptions(item)}</select></label>`;}
function updateScheduleProgress(item,value){
 const next=Math.max(0,Math.min(100,Math.round(Number(value)/10)*10));const prev=progressValue(item);
 if(next===prev)return false;
 item.progress=next;item.done=next===100;item.completedAt=item.done?new Date().toISOString():'';
 if(!Array.isArray(item.progressHistory))item.progressHistory=[];
 item.progressHistory.push({date:new Date().toISOString(),from:prev,to:next,actor:pairUserName});
 return true;
}
function updateWorkProgress(item,value){
 const next=Math.max(0,Math.min(100,Math.round(Number(value)/10)*10));const prev=progressValue(item);
 if(next===prev)return false;
 item.progress=next;item.status=next===0?'계획':next===100?'완료':'진행중';
 item.completedAt=next===100?new Date().toISOString():'';
 recordWork(item,{date:todayISO(),status:item.status,progress:next,summary:`진행률 ${prev}% → ${next}%`});
 const evt=workEventsLink(item);if(evt)evt.done=item.status==='완료';
 return true;
}

const todayISO=()=>fmt(new Date());

function dashCalendar(){
 const current=state.dashDate, selected=fmt(current),today=todayISO();
 const controls=`<div class="dash-calendar-tools"><div class="tabbar" role="group" aria-label="대시보드 달력 보기 방식">${['month','week','day'].map((m,i)=>`<button class="${state.dashMode===m?'active':''}" data-action="dash-view" data-value="${m}" aria-pressed="${state.dashMode===m}">${['월','주','일'][i]}</button>`).join('')}</div><div class="dash-calendar-nav"><button class="ghost-btn" data-action="dash-today">오늘</button><button class="iconbtn" data-action="dash-prev" aria-label="이전 기간">${ico('left',14)}</button><strong>${dashDateLabel(current)}</strong><button class="iconbtn" data-action="dash-next" aria-label="다음 기간">${ico('arrow',14)}</button></div></div>`;
 let display='';
 if(state.dashMode==='month'){
  let off=new Date(current.getFullYear(),current.getMonth(),1).getDay(), n=new Date(current.getFullYear(),current.getMonth()+1,0).getDate(),count=Math.ceil((off+n)/7)*7;
  display=`<div class="dash-weeknames">${['일','월','화','수','목','금','토'].map((x,i)=>`<span class="${i===0?'kr-sun':i===6?'kr-sat':''}">${x}</span>`).join('')}</div><div class="dash-month-grid">${Array.from({length:count},(_,i)=>{let d=new Date(current.getFullYear(),current.getMonth(),i-off+1),date=fmt(d),es=dashEvents(date);return `<button class="dash-month-day ${date===today?'is-today':''} ${date===selected?'is-selected':''} ${d.getMonth()!==current.getMonth()?'outside':''} ${krWeekendClass(d)}" data-action="dash-select-day" data-date="${date}" title="${date} · 일정 ${es.length}개"><span class="dash-date-number">${d.getDate()}</span>${krHoliday(d)?`<small class="kr-holiday-name">${esc(krHoliday(d))}</small>`:''}${es.length?`<div class="dash-month-events">${es.slice(0,3).map(e=>`<span class="dash-month-event" style="--event-color:${e.visibility==='shared'?'#ef9d54':catColor('calendar',e.categoryId)}" title="${esc(e.time)} ${esc(e.title)}"><b>${esc(e.time)}</b> ${esc(e.title)}</span>`).join('')}${es.length>3?`<small class="dash-more-events">+${es.length-3}개 더</small>`:''}</div><div class="dash-dots">${es.slice(0,3).map(e=>`<i style="background:${catColor('calendar',e.categoryId)}"></i>`).join('')}</div>`:''}</button>`}).join('')}</div>`;
 }else if(state.dashMode==='week'){
  const st=sundayStart(current);
  display=`<div class="dash-week-grid">${Array.from({length:7},(_,i)=>{let d=dadd(st,i),date=fmt(d),es=dashEvents(date);return `<button class="dash-week-day ${date===today?'is-today':''} ${date===selected?'is-selected':''} ${krWeekendClass(d)}" data-action="dash-select-day" data-date="${date}"><small>${days[d.getDay()]}</small><strong>${d.getDate()}</strong><em>${es.length}건</em>${es.slice(0,2).map(e=>`<span class="dash-week-event" style="--event-color:${e.visibility==='shared'?'#ef9d54':catColor('calendar',e.categoryId)}" title="${esc(e.title)}">${esc(e.title)}</span>`).join('')}</button>`}).join('')}</div>`;
 }else{
  let es=dashEvents(selected);
  display=`<div class="dash-day-overview"><strong>${current.getMonth()+1}월 ${current.getDate()}일 (${days[current.getDay()]})</strong><span>${es.length}개 일정</span></div>${es.length?es.map(e=>`<button class="dash-day-item" data-event="${e.id}"><span class="dash-day-time">${esc(e.time)}</span><span class="dash-day-color" style="background:${catColor('calendar',e.categoryId)}"></span><span><strong>${esc(e.title)}</strong><small>${esc(e.location||'장소 미지정')}</small></span></button>`).join(''):'<div class="dash-calendar-empty">선택한 날짜에 등록된 일정이 없습니다.</div>'}`;
 }

// Korean community quote catalog (MIT). Keep attribution as collected; not independently verified.
const QUOTE_CATALOG_URLS=[
 'https://cdn.jsdelivr.net/gh/chkim116/kadvice@master/scripts/fixtures/life_advice.json',
 'https://cdn.jsdelivr.net/gh/chkim116/kadvice@master/scripts/fixtures/motivation_advice.json',
 'https://cdn.jsdelivr.net/gh/chkim116/kadvice@master/scripts/fixtures/etc_advice.json'
];
let expandedDailyQuotes=[];
const QUOTE_CACHE_KEY='wf_quotes_korean_catalog_v1';
const QUOTE_DATE_KEY='wf_daily_quote_selected_v1';
function validatedQuoteList(arr){
 const known=new Set(dailyQuotes.map(q=>q[0].trim()));
 return (Array.isArray(arr)?arr:[]).filter(x=>Array.isArray(x)&&x.length>=2).map(q=>[String(q[0]||'').trim(),String(q[1]||'').trim(),String(q[2]||'').trim()]).filter(q=>{if(!q[0]||!q[1]||q[0].length>260||q[1].length>90||known.has(q[0]))return false;known.add(q[0]);return true});
}
function quoteCatalog(){return [...dailyQuotes,...expandedDailyQuotes];}
function dailyQuote(){
 const date=todayISO();
 // A quote already seen today stays unchanged even when the remote catalog refreshes.
 try{const selected=JSON.parse(localStorage.getItem(QUOTE_DATE_KEY)||'null');if(selected?.date===date&&Array.isArray(selected.quote)&&selected.quote.length>=2)return selected.quote;}catch(_){}
 const list=quoteCatalog(),n=dayNumber(date);
 // Sequential daily rotation with a large offset; no repeats until the corpus is exhausted.
 const i=((n+73)%list.length+list.length)%list.length;
 const q=list[i];
 try{localStorage.setItem(QUOTE_DATE_KEY,JSON.stringify({date,quote:q}));}catch(_){}
 return q;
}
function dailyQuoteHTML(){
 const [quote,author,source]=dailyQuote();
 return `<div class="daily-quote" title="${esc(source||author)}" aria-label="오늘의 명언: ${esc(quote)}. ${esc(author)}"><div class="daily-quote-content"><strong>${esc(quote)}</strong><span>${esc(author)}</span></div></div>`;
}
async function initKoreanQuoteCatalog(){
 try{let cache=JSON.parse(localStorage.getItem(QUOTE_CACHE_KEY)||'null');if(cache&&Array.isArray(cache.quotes)){expandedDailyQuotes=validatedQuoteList(cache.quotes);}}catch(_){}
 try{
  const results=await Promise.all(QUOTE_CATALOG_URLS.map(async u=>{const r=await fetch(u,{mode:'cors',cache:'force-cache'});if(!r.ok)throw Error('quote source HTTP '+r.status);return r.json()}));
  const catalog=results.flat().filter(row=>typeof row?.message==='string'&&typeof row?.author==='string').map(row=>[row.message,row.author,'Kadvice · 공동체 수집']);
  expandedDailyQuotes=validatedQuoteList(catalog);
  localStorage.setItem(QUOTE_CACHE_KEY,JSON.stringify({quotes:expandedDailyQuotes,loadedAt:todayISO()}));
 }catch(err){console.info('온라인 명언 모음 로드 불가: 저장된 명언을 사용합니다.',err?.message||err);}
}

 setInterval(()=>{let today=todayISO();if(today!==lastDate){lastDate=today;const el=document.querySelector('.daily-quote');if(el)el.outerHTML=dailyQuoteHTML();}},60000);
}

function ganttRange(items){

 const earliest=starts[0]||scheduleToday(),latest=ends.at(-1)||earliest;
 let a=new Date(earliest+'T12:00:00'),b=new Date(latest+'T12:00:00');
 if(a>b){b=new Date(a)}
 let cursor,final;
 if(mode==='fit'){
  cursor=new Date(a.getFullYear(),0,1,12);final=new Date(b.getFullYear()+1,0,1,12);
 }else if(mode==='month'){
  cursor=new Date(a.getFullYear(),a.getMonth(),1,12);final=new Date(b.getFullYear(),b.getMonth()+1,1,12);
 }else{
  cursor=new Date(a.getFullYear(),a.getMonth(),1,12);final=new Date(b.getFullYear(),b.getMonth()+1,1,12);

   lower=`${cursor.getMonth()+1}월`;
   top=`${cursor.getFullYear()}년`;key=top;
  }else if(mode==='month'){
   const first=new Date(cursor.getFullYear(),cursor.getMonth(),1,12);
   const monthEnd=new Date(cursor.getFullYear(),cursor.getMonth()+1,1,12);

function ganttX(range,date){

function ganttBar(startDate,dueDate,range,label,cl='',title=''){
 if(!startDate||!dueDate)return '';

function minStart(arr){let dates=arr.map(s=>s.start).filter(Boolean).sort();let date=new Date((dates[0]||scheduleToday())+'T12:00:00');let weekStart=monday(date);return weekStart}
function projectCard(p){return projectSummaryCard(p)}
function projectListRows(items){

}
function projectsPage(){

   .sort((a,b)=>(projectDue(a.id)||'9999').localeCompare(projectDue(b.id)||'9999'));

function groupScheduleChart(group){

 const range=ganttRange(items),width=200;
 const head=`<div class="vg-row vg-axis-row"><div class="vg-label vg-axis-label"><strong>세부일정</strong><small>${items.length}개 항목</small></div>${ganttAxis(range)}</div>`;
 const rows=items.slice().sort((a,b)=>a.start.localeCompare(b.start)).map(s=>{const status=scheduleStatus(s);return `<div class="vg-row vg-task-row"><div class="vg-label vg-task-label"><i class="vg-status-dot ${status.type}"></i><button class="text-link" data-schedule="${esc(s.id)}" title="${esc(s.title)}">${esc(s.title)}</button></div><div class="vg-track vg-task-track">${ganttLines(range.start,range.count,range)}${ganttBar(s.start,effectiveDue(s),range,s.title,status.type,`${s.start} ~ ${effectiveDue(s)}`)}</div></div>`}).join('');
 return `<section class="card group-chart"><div class="vg-intro"><strong>세부일정 일정표</strong><span>${items.filter(s=>s.done).length} / ${items.length}개 완료</span></div><div class="group-chart-scroll"><div class="vg-canvas" style="--vg-label:${width}px;--timeline-width:${range.width}px">${head}${rows}</div></div></section>`;
}

function projectGroupTimeline(p){
 const arr=projectSchedules.filter(s=>s.project===p.id), groups=scheduleGroups.filter(g=>g.project===p.id);
 if(!arr.length)return `<div class="project-overview-empty card">등록된 세부일정이 없습니다. 대분류 아래에서 세부일정을 추가하세요.</div>`;
 const range=ganttRange(arr),width=195;
 const head=`<div class="vg-row vg-axis-row"><div class="vg-label vg-axis-label"><strong>대분류</strong></div>${ganttAxis(range)}</div>`;
 const rows=groups.map(g=>{
  const gs=arr.filter(s=>s.group===g.id),starts=gs.map(s=>s.start).filter(Boolean).sort(),ends=gs.map(effectiveDue).filter(Boolean).sort();
  const done=gs.filter(s=>s.done).length;
  return `<div class="vg-row vg-group-row project-timeline-row" style="--series-color:${chartPalette(g)}"><div class="vg-label vg-group-label">${chartColorPicker(g,'group')}<button class="text-link" data-action="toggle-group-inline" data-id="${esc(g.id)}" title="${esc(g.name)} 세부일정 펼치기">${esc(g.name)}</button><small>${averageProgress(gs)}%</small></div><div class="vg-track vg-group-track">${ganttLines(range.start,range.count,range)}${starts.length?ganttBar(starts[0],ends.at(-1),range,g.name,'group-range',`${g.name}: ${starts[0]} ~ ${ends.at(-1)}`):''}</div></div>`;
 }).join('');
 const orphan=arr.filter(s=>!groups.some(g=>g.id===s.group));
 const rest=orphan.length?`<div class="vg-row vg-group-row project-timeline-row"><div class="vg-label vg-group-label"><span>미분류</span></div><div class="vg-track vg-group-track">${ganttLines(range.start,range.count,range)}${ganttBar(orphan.map(s=>s.start).sort()[0],orphan.map(effectiveDue).sort().at(-1),range,'미분류','group-range')}</div></div>`:'';
 return `<section class="card project-overview-chart" aria-label="대분류 일정 현황"><div class="project-chart-top"><strong>프로젝트 일정</strong><span>대분류 ${groups.length}개</span></div><div class="unified-scroll project-overview-scroll" data-range-start="${fmt(range.start)}" data-today-offset="${ganttTodayIndex(range)>=0?range.segments[ganttTodayIndex(range)].left+range.segments[ganttTodayIndex(range)].width/2:-1}" data-day-count="${range.count}" tabindex="0" aria-label="프로젝트 대분류 일정 가로 스크롤"><div class="vg-canvas" style="--vg-label:${width}px;--timeline-width:${range.width}px">${head}${rows}${rest}</div></div></section>`;
}

const workRange=()=>{const d=state.workAnchor||new Date(),mode=state.workPeriod||'all';if(mode==='day')return [fmt(d),fmt(d)];if(mode==='week')return [fmt(monday(d)),fmt(dadd(monday(d),6))];if(mode==='month')return [fmt(new Date(d.getFullYear(),d.getMonth(),1)),fmt(new Date(d.getFullYear(),d.getMonth()+1,0))];return ['', '9999-12-31'];};

 function flush(){
  if(!group.length)return;
  const laneEnds=[];
  for(const ev of group){
   let lane=laneEnds.findIndex(end=>end<=ev.start);
   if(lane<0){lane=laneEnds.length;laneEnds.push(0)}
   ev.lane=lane;laneEnds[lane]=ev.end;
  }
  for(const ev of group){ev.lanes=laneEnds.length;result.push(ev)}
  group=[];groupEnd=-1;
 }
 for(const ev of sorted){
  if(group.length&&ev.start>=groupEnd)flush();
  group.push(ev);groupEnd=Math.max(groupEnd,ev.end);
 }
 flush();return result;
}
function dayGrid(){
 const date=fmt(state.date),es=calendarAudienceFilter(filterByCategory('calendar',events)).filter(e=>e.date===date);
 const allDay=[],timed=[];
 for(const event of es){
  const start=dayMinute(event.time),rawEnd=dayMinute(event.end,true);
  // Older all-day entries were stored as 00:00–23:59, without an allDay flag.
  const isAllDay=event.allDay===true||event.allDay==='1'||event.allDay===1||(start===0&&rawEnd!==null&&rawEnd>=1439);
  if(isAllDay||start===null){allDay.push(event);continue}
  const end=rawEnd!==null&&rawEnd>start?rawEnd:Math.min(1440,start+60);
  timed.push({event,start,end});
 }
 const startHour=Math.max(0,Math.min(8,...timed.map(e=>Math.floor(e.start/60))));
 const endHour=Math.min(24,Math.max(19,...timed.map(e=>Math.ceil(e.end/60))));
 const pxPerHour=72,height=(endHour-startHour)*pxPerHour;
 const minutesToPx=minutes=>(minutes-startHour*60)*pxPerHour/60;
 const hours=Array.from({length:endHour-startHour+1},(_,i)=>startHour+i);
 const labels=hours.map((hh,i)=>`<span class="day-hour-label" style="top:${i*pxPerHour}px">${String(hh).padStart(2,'0')}:00</span>`).join('');
 const rules=hours.map((hh,i)=>`<div class="day-hour-rule" style="top:${i*pxPerHour}px"></div>`).join('');
 const blocks=dayTimedLayout(timed).map(({event,start,end,lane,lanes})=>{
  const color=catColor('calendar',event.categoryId),safeColor=/^#[0-9A-Fa-f]{6}$/.test(color)?color:'#899add';
  const top=minutesToPx(start),span=(end-start)*pxPerHour/60;
  const left=lane/lanes*100,width=100/lanes;
  const label=`${event.title||'일정'} · ${event.time||''}–${event.end||''}`;
  const dense=span<48;
  return `<button type="button" class="day-event-block${dense?' day-event-compact':''}${event.done?' day-event-done':''}" data-event="${esc(event.id)}" style="top:${top+2}px;height:${Math.max(13,span-4)}px;left:calc(${left.toFixed(4)}% + 4px);width:calc(${width.toFixed(4)}% - 8px);--day-event-color:${safeColor}" title="${esc(label)}"><strong>${event.entryType==='work'?'▣ ':event.important?'📌 ':''}${esc(event.title)}</strong><small>${esc(event.time||'')} – ${esc(event.end||'')}</small>${event.location&&!dense?`<span class="day-event-location">${esc(event.location)}</span>`:''}</button>`;
 }).join('');
 const now=new Date(),currentMinute=now.getHours()*60+now.getMinutes();
 const line=date===fmt(now)&&currentMinute>=startHour*60&&currentMinute<=endHour*60?
  `<div class="day-now-line" style="top:${minutesToPx(currentMinute)}px" title="현재 시간"><i></i></div>`:'';
 const allDaySection=allDay.length?`<div class="day-all-day"><span>종일 / 시간 미지정</span><div>${allDay.map(e=>`<button type="button" class="day-all-day-event" data-event="${esc(e.id)}" title="${esc(e.title)}">${esc(e.title)}</button>`).join('')}</div></div>`:'';
 return `${allDaySection}<div class="day-timeline-guide">일정 블록의 길이는 시작·종료 시간에 비례합니다. 겹치는 일정은 나란히 표시됩니다.</div><div class="day-timeline" style="--day-timeline-height:${height}px"><div class="day-time-scale">${labels}</div><div class="day-timeline-canvas">${rules}${line}${blocks}</div></div>`;
}

 case 'new':state.productEditId=null;state.productDraftCover=null;state.modal='product-form';draw();return;
 case 'edit':state.productEditId=id;state.productDraftCover=null;state.modal='product-form';draw();return;
 case 'open':state.productId=id;state.productTab='overview';draw();document.querySelector('.content')?.scrollTo(0,0);return;
 case 'back':state.productId=null;draw();return;
 case 'tab':state.productTab=el.dataset.value;draw();return;
 case 'type':state.productType=el.dataset.value;draw();return;
 case 'visibility':state.productVisibility=el.dataset.value;draw();return;
 case 'view':state.productView=el.dataset.value;draw();return;
 case 'favorites':state.productFavorites=!state.productFavorites;draw();return;
 case 'trash':state.productTrash=!state.productTrash;state.productStatus='all';draw();return;
 case 'favorite':if(!p)return;p.favorites=p.favorites||[];p.favorites=p.favorites.includes(pairUser)?p.favorites.filter(v=>v!==pairUser):[...p.favorites,pairUser];prodUpdate();return;
 case 'cover-remove':state.productDraftCover='';const target=document.querySelector('#product-cover-preview');if(target)target.innerHTML=prodThumb({name:'제품'});return;
 case 'entry-new':state.productEntryKind=kind;state.productEntryId=null;state.modal='product-entry';draw();return;
 case 'entry-edit':state.productEntryKind=kind;state.productEntryId=id;state.modal='product-entry';draw();return;
 case 'process-move':{const obj=products.find(x=>x.id===state.productId);if(!obj)return;const index=obj.process.findIndex(x=>x.id===id),next=index+Number(el.dataset.dir);if(index<0||next<0||next>=obj.process.length)return;[obj.process[index],obj.process[next]]=[obj.process[next],obj.process[index]];prodTouch(obj);prodUpdate();return;}
 case 'entry-delete':{const obj=products.find(x=>x.id===state.productId);if(!obj||!['changes','issues','notes','history','learning','versions','process'].includes(kind))return;const entry=obj[kind].find(v=>v.id===id);if(!entry||!confirm(`“${entry.title}” 항목을 삭제할까요?`))return;obj[kind]=obj[kind].filter(v=>v.id!==id);prodTouch(obj);prodUpdate();toast('삭제했습니다.');return;}
 case 'delete':if(!p||!confirm(`“${p.name}” 자료를 삭제된 자료로 이동할까요?`))return;p.deletedAt=prodStamp();state.productId=null;prodUpdate();toast('삭제된 자료로 이동했습니다.');return;
 case 'restore':if(!p)return;p.deletedAt=null;state.productTrash=false;prodTouch(p);prodUpdate();toast('자료를 복구했습니다.');return;
 case 'file-download':void window.duoFiles?.downloadProduct?.(id);return;
 case 'file-unlink':{const obj=products.find(x=>x.id===state.productId);if(!obj||!confirm('자료에서 파일 연결을 해제할까요? 파일은 파일 관리에 남습니다.'))return;obj.files=obj.files.filter(f=>f.id!==id);prodTouch(obj);prodUpdate();return;}
 case 'project-go':state.page='projects';state.projectId=id;state.projectTab='overview';draw();return;
 case 'project-unlink':{const obj=products.find(x=>x.id===state.productId);if(!obj)return;obj.linkedProjects=obj.linkedProjects.filter(v=>v!==id);prodTouch(obj);prodUpdate();return;}
 }}

 document.addEventListener('submit',e=>{
  if(e.target.id==='product-form'){
   e.preventDefault();const fd=Object.fromEntries(new FormData(e.target)),name=fd.name?.trim();if(!name){toast('제품명을 입력해 주세요.');return}let old=products.find(x=>x.id===state.productEditId);if(old&&old.files?.length&&old.visibility!==fd.visibility){toast('첨부파일이 있는 제품은 공유 범위를 변경할 수 없습니다. 파일을 먼저 정리해 주세요.');return;}

   if(old)Object.assign(old,patch);else{old={id:'prod-'+window.__workspace_uuid(),ownerId:pairUser,createdAt:now,changes:[],issues:[],notes:[],history:[],learning:[],versions:[],process:[],files:[],linkedProjects:[],favorites:[],...patch};products.push(old)}
   state.productEditId=null;state.productDraftCover=null;state.modal=null;state.page='products';state.productId=old.id;state.productTab='overview';prodUpdate();toast('자료가 저장되었습니다.');return;
  }
  if(e.target.id==='product-entry-form'){
   e.preventDefault();const obj=products.find(x=>x.id===state.productId),kind=state.productEntryKind;if(!obj||!['changes','issues','notes','history','learning','versions','process'].includes(kind))return;const values=Object.fromEntries(new FormData(e.target));if(!values.title?.trim()){toast('제목을 입력해 주세요.');return}let original=obj[kind].find(x=>x.id===state.productEntryId);const patch={...values,title:values.title.trim(),date:values.date||todayISO(),updatedAt:prodStamp()};if(original)Object.assign(original,patch);else obj[kind].push({id:'entry-'+window.__workspace_uuid(),...patch});prodTouch(obj);state.modal=null;state.productEntryId=null;prodUpdate();toast('저장했습니다.');return;
  }
  if(e.target.id==='product-link-project-form'){
   e.preventDefault();const obj=products.find(x=>x.id===state.productId),id=e.target.elements.projectId?.value;if(!obj||!id||!projects.some(x=>x.id===id)||obj.linkedProjects.includes(id))return;obj.linkedProjects.push(id);prodTouch(obj);prodUpdate();toast('프로젝트를 연결했습니다.');return;
  }
 },true);
 document.addEventListener('input',e=>{if(e.target.id==='product-search'){state.productSearch=e.target.value;const pos=e.target.selectionStart;document.querySelector('.content').innerHTML=productListPage();const el=document.querySelector('#product-search');if(el){el.focus();el.setSelectionRange(pos,pos)}}});
 document.addEventListener('change',e=>{
  const t=e.target;if(t.id==='material-kind-filter'){state.productKind=t.value;draw();return}
  if(t.id==='product-state-filter'){state.productStatus=t.value;draw();return}
  if(t.id==='product-order'){state.productSort=t.value;draw();return}
  if(t.id==='product-cover-input'){const file=t.files?.[0];if(!file)return;if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>8*1024*1024){toast('8MB 이하 JPG·PNG·WEBP 이미지를 선택해 주세요.');t.value='';return}const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{try{const scale=Math.min(1,480/Math.max(img.naturalWidth,img.naturalHeight)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);const data=canvas.toDataURL('image/jpeg',.76);state.productDraftCover=data;const el=document.querySelector('#product-cover-preview');if(el)el.innerHTML=`<img src="${data}" alt="대표 이미지">`;toast('대표 이미지가 선택됐습니다.')}finally{URL.revokeObjectURL(url)}};img.onerror=()=>{URL.revokeObjectURL(url);toast('이미지를 읽을 수 없습니다.')};img.src=url;return;}
  if(t.id==='product-attachment-input'){
   const file=t.files?.[0],obj=products.find(x=>x.id===state.productId);if(!file||!obj)return;t.value='';void (async()=>{try{const row=await window.duoFiles?.uploadProduct?.(file,obj.visibility);if(!row)return;obj.files.push({id:row.id,name:row.original_name,date:prodStamp(),sizeText:row.size_bytes>1048576?(row.size_bytes/1048576).toFixed(1)+' MB':Math.ceil(row.size_bytes/1024)+' KB'});prodTouch(obj);prodUpdate();toast('파일을 연결했습니다.')}catch(err){toast('파일 업로드 실패: '+err.message)}})();return;
  }
 },true);

function trashPage(){const groups=[['personal',personalTrash,'내 휴지통'],['shared',sharedTrash,'공유 휴지통']];
 return `${header('휴지통','삭제한 업무·일정·프로젝트·세부일정을 복구할 수 있습니다.','<span class="small-tag">복구 가능</span>')}<div class="trash-intro">실수로 삭제해도 안전하게 복구할 수 있어요. 영구 삭제는 복구할 수 없습니다. 파일은 파일·공유 폴더 화면의 파일 휴지통에서 관리합니다.</div>${groups.map(([scope,items,name])=>`<section class="card trash-section"><div class="sect-head"><h2>${name} <span class="trash-count">${items.length}</span></h2></div>${items.length?items.map(e=>`<div class="trash-item"><div class="trash-item-info"><strong>${esc(e.item?.title||e.item?.name||'삭제된 항목')}</strong><small>${{task:'업무',event:'일정',project:'프로젝트',schedule:'세부일정'}[e.kind]||e.kind} · ${esc(e.deletedBy||'')} · ${esc(e.deletedAt.slice(0,10))}</small></div><button class="ghost-btn" data-action="trash-restore" data-scope="${scope}" data-id="${e.id}">복구</button><button class="ghost-btn trash-danger" data-action="trash-purge" data-scope="${scope}" data-id="${e.id}">휴지통으로 이동</button></div>`).join(''):'<div class="trash-empty">삭제된 항목이 없습니다.</div>'}</section>`).join('')}`

function restoreTrash(entry){let obj=structuredClone(entry.item);
 if(entry.kind==='task'){if(!tasks.some(x=>x.id===obj.id)){if(obj.project&&!projects.some(p=>p.id===obj.project))obj.project='';tasks.push(obj);const ev=entry.extra?.linkedEvent;if(ev&&!events.some(x=>x.id===ev.id))events.push(structuredClone(ev))}}
 else if(entry.kind==='event'){if(!events.some(x=>x.id===obj.id)){if(obj.project&&!projects.some(p=>p.id===obj.project))obj.project='';events.push(obj);const t=entry.extra?.linkedTask;if(t&&!tasks.some(x=>x.id===t.id))tasks.push(structuredClone(t))}}
 else if(entry.kind==='schedule'){if(!projectSchedules.some(x=>x.id===obj.id)){if(!projects.some(p=>p.id===obj.project))throw new Error('먼저 연결된 프로젝트를 복구하세요.');projectSchedules.push(obj)}}
 else if(entry.kind==='project'){
  if(projects.some(x=>x.id===obj.id))throw new Error('이미 같은 프로젝트가 있습니다.');projects.push(obj);
  for(const g of entry.extra.groups||[])if(!scheduleGroups.some(x=>x.id===g.id))scheduleGroups.push(structuredClone(g));
  for(const v of entry.extra.schedules||[])if(!projectSchedules.some(x=>x.id===v.id))projectSchedules.push(structuredClone(v));
  for(const t of tasks)if((entry.extra.linkedTasks||[]).includes(t.id))t.project=obj.id;
  for(const ev of events)if((entry.extra.linkedEvents||[]).includes(ev.id))ev.project=obj.id;
 }
}

async function accountAction(action,el){
 if(loading)return;message='';error='';
 try{
  if(action==='account'){dialog=true;renderDialog();return;}
  if(action==='close-dialog'){dialog=false;renderDialog();return;}
  if(action==='demo-switch'){
   if(mode!=='demo')throw new Error('로컬 전환은 로그아웃 후 가능합니다.');
   if(!localUsers().some(x=>x.id===el.dataset.user))throw new Error('존재하지 않는 사용자입니다.');
   demoSave();demoLoad(el.dataset.user);dialog=false;renderDialog();return;
  }
  if(action==='demo-add'){
   if(mode!=='demo')throw new Error('로컬 사용자 추가만 지원합니다.');
   const name=$('#local-user-name')?.value.trim();if(!name||name.length>30)throw new Error('이름을 1~30자로 입력하세요.');
   const users=localUsers();if(users.some(x=>x.name===name))throw new Error('같은 이름이 이미 있습니다.');
   const id='local-'+window.__workspace_uuid();users.push({id,name});saveLocalUsers(users);
   members=users.map(u=>({user_id:u.id,display_name:u.name}));message='미리보기 사용자가 추가됐습니다.';duoRedraw();return;
  }
  if(action==='backup'){backup();return;}
  if(action==='sign-in'||action==='sign-up'){
   if(!api)throw new Error('Supabase 연결이 설정되지 않았습니다.');
   const email=$('#duo-email')?.value.trim(),password=$('#duo-password')?.value;
   if(!email||!password||password.length<8)throw new Error('이메일과 8자 이상의 비밀번호가 필요합니다.');
   loading=true;
   const r=action==='sign-in'?await api.auth.signInWithPassword({email,password}):
     await api.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname}});
   if(r.error)throw r.error;
   if(r.data?.session?.user){await attachAccount(r.data.session.user)}
   else message='이메일 인증 메일을 확인하세요. 인증 후 Master 승인까지 필요합니다.';
  }
  if(action==='sign-out'){
   if(mode==='cloud'&&(dirty||saving))throw new Error('저장 중인 내용이 있습니다. 먼저 백업하세요.');
   const {error:e}=await api.auth.signOut();if(e)throw e;
   account=null;isMaster=false;canCreateSpace=false;accessInfo=null;workspaceEditTarget=null;workspaceSelectedId=null;accessStatus='pending';workspaceMemberships=[];
   demoLoad('demo-a');dialog=true;
  }
  if(action==='check-access'){
   if(!account)throw new Error('로그인이 필요합니다.');loading=true;await attachAccount(account,spaceId);
  }
  if(action==='refresh-permissions'){
   if(!api||!account)throw new Error('로그인 상태를 확인하세요.');
   loading=true;await attachAccount(account,spaceId);message='현재 Supabase 서버의 권한 정보를 다시 확인했어.';
  }
  if(action==='open-edit-space'){
   const selected=$('#ws-space-select')?.value;
   const target=workspaceMemberships.find(m=>m.space_id===selected);
   if(!target)throw new Error('수정할 작업공간을 선택하세요.');
   if(!isMaster&&!['owner','admin'].includes(target.role))throw new Error('이 공간을 수정하려면 Owner 또는 Admin 권한이 필요합니다.');
   workspaceEditTarget=target.space_id;message='수정할 이름과 설명을 입력한 뒤 저장하세요.';
  }
  if(action==='cancel-edit-space'){workspaceEditTarget=null;message='작업공간 수정을 취소했습니다.';}
  if(action==='create-space'||action==='join-space'){
   if(!api||!account||accessStatus!=='approved')throw new Error('Master의 계정 승인이 필요합니다.');
   if(mode==='cloud'&&(dirty||saving))throw new Error('저장 중인 수정이 있습니다. 저장 완료 후 다시 시도하세요.');
   const name=$('#ws-display-name')?.value.trim()||profileName;
   if(!name)throw new Error('표시 이름을 입력하세요.');
   if(action==='create-space'){
     // Always check live server permission, rather than a cached browser flag.
     const {data:currentAccess,error:ae}=await api.rpc('ws_get_access');if(ae)throw ae;
     accessInfo=currentAccess||{};accessStatus=accessInfo.status||'pending';isMaster=!!accessInfo.is_master;canCreateSpace=!!accessInfo.can_create;

   }
   const fn=action==='create-space'?'ws_create_space':'ws_join_space';
   const arg=action==='create-space'?{p_name:$('#ws-create-name')?.value.trim(),p_display_name:name}:

   if(action==='create-space'&&!arg.p_name)throw new Error('새 작업공간 이름을 입력하세요.');
   if(action==='join-space'&&!arg.p_token)throw new Error('초대 코드를 입력하세요.');
   loading=true;const {data:created,error:e}=await api.rpc(fn,arg);if(e)throw e;
   await attachAccount(account,created);message='작업공간이 연결되었습니다.';
  }
  if(action==='invite'){
   if(!api||!spaceId)throw new Error('가입한 작업공간이 없습니다.');
   loading=true;const {data,error:e}=await api.rpc('ws_invite_member',
      {p_space:spaceId,p_role:$('#ws-invite-role')?.value||'editor'});if(e)throw e;
   message='초대 코드 (24시간 유효, 1회 사용): '+data+' · 안전한 방법으로 전달하세요.';
  }
  if(action==='switch-space'){
   if(!api||!account)throw new Error('로그인이 필요합니다.');
   if(dirty||saving)throw new Error('저장되지 않은 수정이 있습니다. 백업 및 저장 후 전환하세요.');
   const selected=$('#ws-space-select')?.value;
   const next=workspaceMemberships.find(m=>m.space_id===selected);
   if(!next)throw new Error('작업공간을 선택하세요.');
   if(next.space_id!==spaceId){loading=true;await activateWorkspace(next);}
  }
  if(action==='save-space'){
   const target=workspaceMemberships.find(m=>m.space_id===workspaceEditTarget);
   if(!target)throw new Error('수정할 작업공간을 먼저 선택하세요.');
   if(!['owner','admin'].includes(target.role)&&!isMaster)throw new Error('선택한 공간의 관리자 권한이 필요합니다.');
   if(dirty||saving)throw new Error('저장 중인 수정이 있습니다.');
   const name=$('#ws-edit-name')?.value.trim(),desc=$('#ws-edit-description')?.value.trim()||'';
   if(!name||name.length>80||desc.length>500)throw new Error('이름(1~80자), 설명(500자 이하)을 확인하세요.');
   loading=true;const {error:e}=await api.rpc('ws_update_space',{p_space:target.space_id,p_name:name,p_description:desc});if(e)throw e;
   workspaceEditTarget=null;await attachAccount(account,spaceId);message='선택한 작업공간의 이름과 설명을 저장했어.';
  }
  if(action==='archive-space'){
   if(dirty||saving)throw new Error('저장 중인 수정이 있습니다. 백업 후 다시 시도하세요.');
   const targetId=el.dataset.space||spaceId;
   const target=targetId===spaceId?{name:spaceName}:masterOverview?.spaces?.find(x=>x.id===targetId);
   if(!target)throw new Error('작업공간을 찾지 못했습니다.');
   const exact=prompt(`“${target.name}” 작업공간을 삭제(보관)합니다.\n구성원 접근이 즉시 중단되며, 추후 복구할 수 있습니다.\n확인하려면 작업공간 이름을 정확히 입력하세요.`,'');
   if(exact===null)return;
   if(exact!==target.name)throw new Error('작업공간 이름이 일치하지 않아 삭제하지 않았습니다.');
   loading=true;const {error:e}=await api.rpc('ws_archive_space',{p_space:targetId,p_confirm_name:exact});if(e)throw e;
   masterInspectedSpace=null;masterSpaceMembers=[];
   await attachAccount(account,targetId===spaceId?null:spaceId);message='작업공간을 삭제(보관)했습니다. 보관 목록에서 복구할 수 있습니다.';
  }
  if(action==='restore-space'){
   if(!account)throw new Error('로그인이 필요합니다.');
   const target=el.dataset.space;
   if(!confirm('선택한 작업공간을 복구하고 구성원의 접근 권한을 다시 활성화할까요?'))return;
   loading=true;const {error:e}=await api.rpc('ws_restore_space',{p_space:target});if(e)throw e;
   masterInspectedSpace=null;masterSpaceMembers=[];
   await attachAccount(account,spaceId||target);message='작업공간이 복구되었습니다.';
  }
  if(action==='leave-space'){
   if(currentRole==='owner')throw new Error('소유자는 소유권 이전 후 나갈 수 있습니다.');
   if(dirty||saving)throw new Error('저장 중인 변경이 있습니다. 저장 또는 백업 후 진행하세요.');
   if(!confirm(`“${spaceName}” 작업공간에서 나갈까요? 공통 자료는 유지됩니다.`))return;
   loading=true;const {error:e}=await api.rpc('ws_remove_member',{p_space:spaceId,p_user:userId});if(e)throw e;
   await attachAccount(account,null);message='작업공간에서 나왔습니다.';
  }
  if(action==='transfer-owner'){
   if(currentRole!=='owner')throw new Error('현재 소유자만 소유권을 이전할 수 있습니다.');
   const target=$('#ws-new-owner')?.value,targetMember=members.find(m=>m.user_id===target);
   if(!targetMember)throw new Error('이전 대상 구성원을 선택하세요.');
   if(!confirm(`소유권을 “${targetMember.display_name}”님에게 이전할까요?\n내 권한은 관리자로 변경됩니다.`))return;
   loading=true;const {error:e}=await api.rpc('ws_transfer_ownership',{p_space:spaceId,p_new_owner:target});if(e)throw e;
   await attachAccount(account,spaceId);message='소유권 이전이 완료되었습니다.';
  }
  if(action==='member-role'){
   if(currentRole!=='owner'&&!isMaster)throw new Error('소유자만 권한을 변경할 수 있습니다.');
   const role=el.value,uid=el.dataset.user;
   const target=members.find(m=>m.user_id===uid);
   if(!target||target.role==='owner')throw new Error('변경할 수 없는 계정입니다.');
   loading=true;const {error:e}=await api.rpc('ws_set_member_role',{p_space:spaceId,p_user:uid,p_role:role});if(e)throw e;
   target.role=role;message='구성원 권한을 변경했습니다.';
  }
  if(action==='remove-member'){
   const uid=el.dataset.user,target=members.find(m=>m.user_id===uid);
   if(!target)throw new Error('구성원을 찾을 수 없습니다.');
   if(!confirm(`“${target.display_name}” 계정을 이 작업공간에서 내보낼까요?`))return;
   loading=true;const {error:e}=await api.rpc('ws_remove_member',{p_space:spaceId,p_user:uid});if(e)throw e;
   members=members.filter(m=>m.user_id!==uid);message='구성원의 작업공간 접근 권한을 해제했습니다.';
  }
  if(action==='sync-now'){
   if(dirty)throw new Error('저장되지 않은 수정이 있습니다. 먼저 백업하세요.');
   loading=true;await refreshCloud(true);await fileUI.reload();message='클라우드에서 최신 데이터를 불러왔습니다.';
  }
  if(action==='master-refresh'){
   if(!isMaster)throw new Error('Master 전용 기능입니다.');
   loading=true;await refreshAdminMeta();message='관리 정보를 새로고침했습니다.';
  }
  if(action==='master-self-service'){
   if(!isMaster)throw new Error('Master 전용 기능입니다.');
   const next=!masterOverview?.allow_member_space_creation;
   if(!confirm(`일반 승인 사용자의 새 작업공간 생성을 ${next?'허용':'차단'}할까요?`))return;
   loading=true;const {error:e}=await api.rpc('ws_master_set_self_service',{p_enabled:next});if(e)throw e;
   await attachAccount(account,spaceId);message='작업공간 생성 정책을 변경했습니다.';
  }
  if(action==='master-access'){
   if(!isMaster)throw new Error('Master 전용 기능입니다.');
   const uid=el.dataset.user,status=document.getElementById('ws-access-'+uid)?.value;
   if(!uid||!status)throw new Error('계정 상태를 선택하세요.');
   if(!confirm(`선택한 계정의 사용 상태를 “${statusNames[status]}”로 변경할까요?`))return;
   loading=true;const {error:e}=await api.rpc('ws_master_set_access',{p_user:uid,p_status:status});if(e)throw e;
   await refreshAdminMeta();message='계정 상태를 변경했습니다.';
  }
  if(action==='master-inspect'){
   if(!isMaster)throw new Error('Master 전용 기능입니다.');
   const target=$('#ws-master-space')?.value;if(!target)throw new Error('작업공간을 선택하세요.');
   loading=true;const {data,error:e}=await api.rpc('ws_master_members',{p_space:target});if(e)throw e;
   masterInspectedSpace=target;masterSpaceMembers=Array.isArray(data)?data:[];
  }
  if(action==='master-invite'){
   if(!isMaster)throw new Error('Master 전용 기능입니다.');
   const target=el.dataset.space,role=$('#ws-master-invite-role')?.value||'editor';
   loading=true;const {data,error:e}=await api.rpc('ws_invite_member',{p_space:target,p_role:role});if(e)throw e;
   message='초대 코드 (24시간 유효·1회): '+data+' · 안전한 방법으로 전달하세요.';
  }
  if(action==='master-rename'){
   if(!isMaster)throw new Error('Master 전용 기능입니다.');
   const target=masterOverview?.spaces?.find(x=>x.id===el.dataset.space);
   if(!target)throw new Error('작업공간을 찾을 수 없습니다.');
   const name=prompt('새 작업공간 이름',target.name);if(name===null)return;
   if(!name.trim())throw new Error('이름을 입력하세요.');
   const desc=prompt('작업공간 설명 (최대 500자)',target.description||'');if(desc===null)return;
   loading=true;const {error:e}=await api.rpc('ws_update_space',{p_space:target.id,p_name:name.trim(),p_description:desc});if(e)throw e;
   await attachAccount(account,spaceId);message='작업공간 정보를 수정했습니다.';
  }
  if(action==='master-member-role'||action==='master-remove-member'||action==='master-transfer-owner'){
   if(!isMaster||!masterInspectedSpace)throw new Error('Master 작업공간을 먼저 선택하세요.');
   const uid=el.dataset.user,target=masterSpaceMembers.find(x=>x.user_id===uid);
   if(!target)throw new Error('구성원을 찾을 수 없습니다.');
   let fn,args;
   if(action==='master-member-role'){
    fn='ws_set_member_role';args={p_space:masterInspectedSpace,p_user:uid,p_role:el.value};
   }else if(action==='master-remove-member'){
    if(!confirm(`“${target.display_name}” 구성원을 내보낼까요?`))return;
    fn='ws_remove_member';args={p_space:masterInspectedSpace,p_user:uid};
   }else{
    if(!confirm(`“${target.display_name}” 계정으로 소유권을 이전할까요?`))return;
    fn='ws_transfer_ownership';args={p_space:masterInspectedSpace,p_new_owner:uid};
   }
   loading=true;const {error:e}=await api.rpc(fn,args);if(e)throw e;
   const {data,error:me}=await api.rpc('ws_master_members',{p_space:masterInspectedSpace});if(me)throw me;
   masterSpaceMembers=Array.isArray(data)?data:[];
   await refreshAdminMeta();message='Master 관리 작업을 완료했습니다.';
   if(action==='master-transfer-owner'&&masterInspectedSpace===spaceId)await attachAccount(account,spaceId);
  }
 }catch(e){
   error=e.message||String(e);
   if(error.includes('master_permission_required_for_new_workspace')){
     const who=account?.email||'로그인 계정';
     error=`작업공간 생성이 거부됐어. 현재 서버가 ${who} 계정을 Master로 인정하지 않거나 일반 사용자 생성이 제한된 상태야. 「서버 권한 다시 확인」을 누르고, Master를 지정했던 Supabase 프로젝트와 현재 연결 서버가 같은지 확인해.`;
   }
   notice(error,'error');
 }
 finally{loading=false;renderDialog();}
}

document.addEventListener('change',e=>{
 if(e.target.id==='ws-master-space'){
   masterInspectedSpace=e.target.value;masterSpaceMembers=[];
   // Show the workspace edit action immediately, without requiring a separate member-load click.
   renderDialog();return;
 }
 if(e.target.id==='ws-space-select'){
   // A newly selected space needs an explicit edit action; avoid showing the wrong record.
   workspaceSelectedId=e.target.value;workspaceEditTarget=null;renderDialog();return;
 }
 if(e.target.matches('[data-duo-action="member-role"],[data-duo-action="master-member-role"]')){
   void accountAction(e.target.dataset.duoAction,e.target)
 }
});
window.addEventListener('duo:changed',()=>{
 if(mode==='demo'){demoSave();return;}
 if(mode!=='cloud')return;
 if(currentRole==='viewer'&&cloudShared&&JSON.stringify(snapshot().shared)!==cloudShared){
   const p=snapshot().personal;duoImport(p,JSON.parse(cloudShared),{userId,name:profileName,mode:'cloud',preservePage:true});
   notice('열람 권한에서는 공통 데이터를 수정할 수 없습니다.','error');
 }
 queueSave();
});
window.addEventListener('duo:render',()=>{syncNote();updateTop()});
document.addEventListener('click',e=>{const el=e.target.closest('[data-duo-action]');if(['member-role','master-member-role'].includes(el?.dataset.duoAction))return;if(!el||['file-scope','open-folder','folder-back','new-folder','delete-folder','upload-file','download-file','delete-file','reload-files','file-trash','preview-file','close-preview','restore-file','restore-folder','purge-file'].includes(el.dataset.duoAction))return;e.stopPropagation();void accountAction(el.dataset.duoAction,el)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&dialog){dialog=false;renderDialog()}});
document.addEventListener('input',e=>{if(e.target?.id==='ws-master-search'){
 const value=e.target.value.toLowerCase().trim();document.querySelectorAll('[data-master-user-search]').forEach(row=>{row.hidden=!row.dataset.masterUserSearch.includes(value)});
}});
window.addEventListener('online',()=>{if(mode==='cloud'&&dirty&&!error)queueSave()});
// Demo starts immediately. Actual cloud session, if configured, is attached asynchronously.
demoLoad(userId);
void setupCloud();

})();

</script></body></html>
